<temel-page
  lang="en"
  title="Lighting — Yuva"
  max-width="1440"
  color-scheme="dark"
  ><header><temel-reference href="/header.html"></temel-reference></header>
  <main>
    <temel-hero padding="comfortable" width="wide">
      <h1 slot="heading">Lighting</h1>
      <div slot="summary">
        <p>For reading one more page without lighting up the whole room.</p>
      </div>
      <temel-provenance
        slot="provenance:summary"
        source="ai"
        evidence="observed"
        tool="html"
        contribution="modified"
      ></temel-provenance>
      <temel-provenance
        slot="provenance"
        source="ai"
        evidence="observed"
        tool="html"
        contribution="generated"
      ></temel-provenance></temel-hero
    ><yuva-product-grid
      ><temel-query path="/products/lighting/" limit="100" sort="recent"
        ><template name="item"
          ><yuva-product-card
            ><temel-reference
              slot="source"
            ></temel-reference></yuva-product-card></template></temel-query
      ><temel-provenance
        slot="provenance"
        source="ai"
        evidence="observed"
        tool="html"
        contribution="generated"
      ></temel-provenance
    ></yuva-product-grid>
    <temel-loading-boundary></temel-loading-boundary>
  </main>
  <footer><temel-reference href="/footer.html"></temel-reference></footer
></temel-page>
