<temel-page lang="fr" title="Assises — Yuva" max-width="1440"
  ><header><temel-reference href="/fr/header.html"></temel-reference></header>
  <main>
    <temel-hero padding="comfortable" width="wide">
      <h1 slot="heading">Assises</h1>
      <div slot="summary">
        <p>
          Pour le livre que vous vouliez finir et l’invité qui reste pour une
          tasse de plus.
        </p>
      </div>
      <temel-provenance
        slot="provenance:summary"
        source="ai"
        evidence="observed"
        tool="html"
        contribution="modified"
      ></temel-provenance>
      <temel-provenance
        slot="provenance"
        source="ai"
        evidence="observed"
        tool="html"
        contribution="generated"
      ></temel-provenance></temel-hero
    ><yuva-product-grid
      ><temel-query path="/fr/products/seating/" limit="8" sort="path"
        ><template name="item"
          ><yuva-product-card
            ><temel-reference
              slot="source"
            ></temel-reference></yuva-product-card></template
        ><temel-query-paginator
          slot="paginator"
        ></temel-query-paginator></temel-query
      ><temel-provenance
        slot="provenance"
        source="ai"
        evidence="observed"
        tool="html"
        contribution="generated"
      ></temel-provenance
    ></yuva-product-grid>
    <temel-loading-boundary></temel-loading-boundary>
  </main>
  <footer><temel-reference href="/fr/footer.html"></temel-reference></footer
></temel-page>
