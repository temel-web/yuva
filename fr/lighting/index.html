<temel-page
  lang="fr"
  title="Éclairage — Yuva"
  aria-description="Lampes à poser, suspensions et luminaires chaleureux pour les coins lecture et le salon chez Yuva."
  max-width="1440"
  color-scheme="dark"
  ><header><temel-reference href="/fr/header.html"></temel-reference></header>
  <main>
    <temel-hero padding="comfortable" width="wide">
      <h1 slot="heading">Éclairage</h1>
      <div slot="summary">
        <p>Pour lire une page de plus sans éclairer toute la pièce.</p>
      </div>
      <temel-provenance
        slot="provenance:summary"
        source="ai"
        evidence="observed"
        tool="html"
        contribution="modified"
      ></temel-provenance>
      <temel-provenance
        slot="provenance"
        source="ai"
        evidence="observed"
        tool="html"
        contribution="generated"
      ></temel-provenance></temel-hero
    ><yuva-product-grid
      ><temel-query path="/fr/products/lighting/" limit="100" sort="recent"
        ><template name="item"
          ><yuva-product-card
            ><temel-reference
              slot="source"
            ></temel-reference></yuva-product-card></template></temel-query
      ><temel-provenance
        slot="provenance"
        source="ai"
        evidence="observed"
        tool="html"
        contribution="generated"
      ></temel-provenance
    ></yuva-product-grid>
    <temel-loading-boundary></temel-loading-boundary>
  </main>
  <footer><temel-reference href="/fr/footer.html"></temel-reference></footer
></temel-page>
