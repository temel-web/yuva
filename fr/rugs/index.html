<temel-page lang="fr" title="Tapis — Yuva" max-width="1440"
  ><header><temel-reference href="/fr/header.html"></temel-reference></header>
  <main>
    <temel-hero padding="comfortable" width="wide" id="rugs-temel-hero">
      <h1 slot="heading">Tapis</h1>
      <div slot="summary">
        <p>
          Des motifs, de la matière et, sous les pieds nus, quelque chose de
          plus doux que le parquet.
        </p>
      </div>
      <temel-provenance
        slot="provenance:summary"
        source="ai"
        evidence="observed"
        tool="html"
        contribution="modified"
      ></temel-provenance>
      <temel-provenance
        slot="provenance"
        source="ai"
        evidence="observed"
        tool="html"
        contribution="generated"
      ></temel-provenance></temel-hero
    ><yuva-product-grid
      ><temel-query path="/fr/products/rugs/" limit="100" sort="path"
        ><template name="item"
          ><yuva-product-card
            ><temel-reference
              slot="source"
            ></temel-reference></yuva-product-card></template></temel-query
      ><temel-provenance
        slot="provenance"
        source="ai"
        evidence="observed"
        tool="html"
        contribution="generated"
      ></temel-provenance
    ></yuva-product-grid>
    <temel-loading-boundary></temel-loading-boundary>
  </main>
  <footer><temel-reference href="/fr/footer.html"></temel-reference></footer
></temel-page>
