<temel-page
  lang="de"
  title="Leuchten — Yuva"
  aria-description="Tischleuchten, Pendelleuchten und warmes Raumlicht für Leseecken und Wohnzimmer im Demo-Shop von Yuva."
  max-width="1440"
  color-scheme="dark"
  ><header><temel-reference href="/de/header.html"></temel-reference></header>
  <main>
    <temel-hero padding="comfortable" width="wide">
      <h1 slot="heading">Leuchten</h1>
      <div slot="summary">
        <p>Um noch eine Seite zu lesen, ohne gleich den ganzen Raum zu erhellen.</p>
      </div>
      <temel-provenance
        slot="provenance:summary"
        source="ai"
        evidence="observed"
        tool="html"
        contribution="modified"
      ></temel-provenance>
      <temel-provenance
        slot="provenance"
        source="ai"
        evidence="observed"
        tool="html"
        contribution="generated"
      ></temel-provenance></temel-hero
    ><yuva-product-grid
      ><temel-query path="/de/products/lighting/" limit="100" sort="recent"
        ><template name="item"
          ><yuva-product-card
            ><temel-reference
              slot="source"
            ></temel-reference></yuva-product-card></template></temel-query
      ><temel-provenance
        slot="provenance"
        source="ai"
        evidence="observed"
        tool="html"
        contribution="generated"
      ></temel-provenance
    ></yuva-product-grid>
    <temel-loading-boundary></temel-loading-boundary>
  </main>
  <footer><temel-reference href="/de/footer.html"></temel-reference></footer
></temel-page>
